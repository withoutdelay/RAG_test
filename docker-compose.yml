services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-copilot_db}
      POSTGRES_USER: ${POSTGRES_USER:-copilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-copilot}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  redis:
    image: ${REDIS_IMAGE:-redis:7-alpine}
    ports:
      - "${REDIS_PORT:-6379}:6379"

  qdrant:
    image: ${QDRANT_IMAGE:-qdrant/qdrant:v1.12.4}
    ports:
      - "${QDRANT_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  minio:
    image: ${MINIO_IMAGE:-minio/minio:latest}
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data

  gateway:
    build:
      context: ./gateway
      args:
        PYTHON_BASE_IMAGE: ${PYTHON_BASE_IMAGE:-python:3.11-slim}
    ports:
      - "${GATEWAY_PORT:-8001}:8001"
    environment:
      REDIS_ENABLED: "true"
      REDIS_URL: ${GATEWAY_REDIS_URL:-redis://redis:6379/1}
    depends_on:
      - redis

  backend:
    build:
      context: ./backend
      args:
        PYTHON_BASE_IMAGE: ${PYTHON_BASE_IMAGE:-python:3.11-slim}
        BACKEND_EXTRAS: ${BACKEND_EXTRAS:-}
        INSTALL_CPU_TORCH: ${INSTALL_CPU_TORCH:-true}
        TORCH_CPU_INDEX_URL: ${TORCH_CPU_INDEX_URL:-https://download.pytorch.org/whl/cpu}
        HF_ENDPOINT: ${HF_ENDPOINT:-https://huggingface.co}
        HF_HOME: ${HF_HOME:-/opt/huggingface}
        DOCLING_CACHE_DIR: ${DOCLING_CACHE_DIR:-/opt/docling/cache}
        DOCLING_ARTIFACTS_PATH: ${DOCLING_ARTIFACTS_PATH:-}
        PREWARM_DOCLING_MODELS: ${PREWARM_DOCLING_MODELS:-false}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: ${CONTAINER_DATABASE_URL:-postgresql+asyncpg://copilot:copilot@postgres:5432/copilot_db}
      REDIS_URL: ${CONTAINER_REDIS_URL:-redis://redis:6379/0}
      QDRANT_HOST: qdrant
      MINIO_ENDPOINT: minio:9000
      GATEWAY_URL: http://gateway:8001
      HF_ENDPOINT: ${HF_ENDPOINT:-https://huggingface.co}
      HF_HOME: ${HF_HOME:-/opt/huggingface}
      DOCLING_CACHE_DIR: ${DOCLING_CACHE_DIR:-/opt/docling/cache}
      OMP_NUM_THREADS: ${PARSER_CPU_THREADS:-1}
      MKL_NUM_THREADS: ${PARSER_CPU_THREADS:-1}
      OPENBLAS_NUM_THREADS: ${PARSER_CPU_THREADS:-1}
      NUMEXPR_NUM_THREADS: ${PARSER_CPU_THREADS:-1}
      TORCH_NUM_THREADS: ${PARSER_CPU_THREADS:-1}
    depends_on:
      - postgres
      - redis
      - qdrant
      - minio
      - gateway

  frontend:
    build:
      context: ./frontend
      args:
        NODE_BASE_IMAGE: ${NODE_BASE_IMAGE:-node:20-alpine}
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000/api/v1}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1
    depends_on:
      - backend

volumes:
  pg_data:
  qdrant_data:
  minio_data:
