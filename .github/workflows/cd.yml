name: repository-hygiene

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure runtime data is not committed
        run: |
          test ! -f backend/data/app.db
          test ! -d backend/data/uploads || [ -z "$(find backend/data/uploads -type f -print -quit)" ]
          test ! -d output || [ -z "$(find output -type f -print -quit)" ]
