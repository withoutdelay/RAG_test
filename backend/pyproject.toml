[project]
name = "presale-copilot-backend"
version = "0.1.0"
description = "Backend service for the presales copilot MVP"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.14.0",
  "asyncpg>=0.30.0",
  "fastapi>=0.115.0",
  "greenlet>=3.1.1",
  "httpx>=0.28.0",
  "minio>=7.2.0",
  "pydantic-settings>=2.6.0",
  "python-docx>=1.2.0",
  "python-multipart>=0.0.18",
  "qdrant-client>=1.12.0",
  "sqlalchemy>=2.0.36",
  "uvicorn[standard]>=0.32.0",
]

[project.optional-dependencies]
parsing = [
  "docling>=2.0.0",
]
ocr = [
  "pix2tex",
]
embeddings = [
  "sentence-transformers>=3.4.0",
]
full = [
  "docling>=2.0.0",
  "pix2tex",
  "sentence-transformers>=3.4.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
